[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-agent"
version = "0.1.0"
description = "Multi-agent GitHub assistant: review diffs, draft issues/PRs, improve existing items."
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "openai>=1.0.0",
    "PyGithub>=2.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
agent = "cli:app"

[tool.setuptools]
py-modules = ["cli", "orchestrator", "config"]

[tool.setuptools.packages.find]
include = ["agents*", "tools*"]
